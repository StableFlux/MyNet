upstream vite {
    server mynet_dev_frontend:5173;
}

server {
    listen 80;
    server_name localhost;

    # Generous timeouts — keeps Vite HMR and app WebSockets alive
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 10s;

    # All traffic proxied to the Vite dev server.
    # Vite itself handles the /api and /ws proxy to the FastAPI backend,
    # so nginx only needs one upstream.
    location / {
        proxy_pass http://vite;

        # WebSocket upgrade (handles both Vite HMR and the app's /ws)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass real host through so Vite knows the origin
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for HMR / SSE streams
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
