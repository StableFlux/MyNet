# MyNet — Nginx configuration
#
# HTTP-only (default, LAN use):
#   Replace server_name with your hostname or IP.
#   This config serves MyNet over plain HTTP — suitable for trusted local networks.
#
# HTTPS (recommended for internet-facing deployments):
#   1. Obtain a certificate (e.g. Let's Encrypt via certbot, or a self-signed cert).
#   2. Set ssl_certificate / ssl_certificate_key paths below.
#   3. Uncomment the HTTPS server block and the HTTP redirect block.
#   4. Comment out or remove the plain HTTP server block.

# ── HTTP (LAN default) ───────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;   # replace with your hostname or IP

    # Limit request body size — backup files are JSON, 50MB is generous
    client_max_body_size 50M;

    # Security headers (apply even over HTTP on a trusted LAN)
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-Frame-Options           "SAMEORIGIN"        always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'self';" always;

    # Serve frontend static files
    root /var/www/mynet;
    index index.html;

    # SPA fallback — all non-API routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (no auth required)
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;
    }
}


